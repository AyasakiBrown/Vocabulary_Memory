<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="srs.js"></script>
<script src="gre-quant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE 数学词汇</title>
<style>
:root{
  --bg:#f5f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e6e8f0;
  --brand:#0f766e; --brand2:#0e7490; --ok:#10b981; --bad:#ef4444; --star:#f59e0b;
  --chip:#eef0fb; --shadow:0 6px 24px rgba(30,30,80,.08);
}
.dark{
  --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155;
  --chip:#27324a; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain}
button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.wrap{max-width:920px; margin:0 auto; padding:14px 16px 60px}
.hide{display:none!important}
[hidden]{display:none!important}
header{position:sticky; top:0; z-index:30; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 2px 14px rgba(15,118,110,.25)}
.hbar{max-width:920px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px}
.logo{font-weight:800; font-size:18px; letter-spacing:.3px; display:flex; align-items:center; gap:8px; min-width:0}
.logo small{font-weight:500; opacity:.85; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hstats{margin-left:auto; display:flex; gap:14px; font-size:13px; opacity:.95; text-align:center; line-height:1.3}
.hstats b{font-size:16px}
.homelink{flex:0 0 auto; display:inline-flex; align-items:center; height:30px; padding:0 11px 0 9px; border-radius:99px; background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3); color:#fff; font-size:13px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .15s, transform .12s}
.homelink:hover{background:rgba(255,255,255,.28)}
.homelink:active{transform:scale(.95)}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:24px}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 16px; border-radius:12px; font-size:14.5px; font-weight:600; transition:.15s}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{filter:brightness(1.06); color:#fff}
.btn.sm{padding:6px 12px; font-size:13px}
kbd{background:var(--chip); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-size:12px; font-family:inherit}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes gshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* hub — the same night sky as 🌌 词汇星图 */
.gsky{background:radial-gradient(ellipse at 20% 0%,#27357a 0%,transparent 55%),linear-gradient(160deg,#0b1026,#1a2352 70%,#241a4d); color:#e8ecff; border-radius:18px; padding:22px; box-shadow:var(--shadow)}
.gsky .gsub{color:#aab4e6; font-size:13px; line-height:1.6}
.gtop{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.gtitle{font-size:21px; font-weight:800; letter-spacing:.3px}
.glv{margin-left:auto; min-width:190px; text-align:right; font-size:13.5px}
.glv b{font-size:17px; color:#ffd866}
.gxp{height:8px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; margin:6px 0 3px}
.gxp i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#ffd866,#ff9f5a); transition:width .4s}
.glv small{color:#aab4e6}
.gnums{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0 14px}
.gnums div{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:12px 8px; text-align:center}
.gnums b{display:block; font-size:24px; font-weight:800; color:#fff}
.gnums span{font-size:12px; color:#aab4e6}
.gquest{display:grid; gap:8px; margin-bottom:16px}
.gq{display:flex; align-items:center; gap:10px; font-size:13.5px; background:rgba(255,255,255,.06); border-radius:12px; padding:9px 12px}
.gq .gbar{flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden}
.gq .gbar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#7ee0c3,#4fd1ff); transition:width .4s}
.gq b{white-space:nowrap}
.gq.done b{color:#7ee0c3}
.gcta{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.gbtn{flex:1 1 200px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; padding:13px 16px; border-radius:14px; font-size:15.5px; font-weight:700; transition:.15s; touch-action:manipulation}
.gbtn:hover{background:rgba(255,255,255,.16)}
.gbtn.primary{background:linear-gradient(90deg,#ffd866,#ff9f5a); border-color:transparent; color:#2a1c00}
.gbtn.primary:hover{filter:brightness(1.07)}
.gbtn:disabled{opacity:.45; cursor:default}
.gbtn small{display:block; font-size:12px; font-weight:600; opacity:.8; margin-top:2px}
.gsec{margin:18px 0 8px; font-size:13px; color:#aab4e6; font-weight:700; letter-spacing:.3px}
.glists{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px}
.glist{background:#111a3a; color:#dfe6ff; border:1.5px solid #26305c; border-radius:14px; padding:11px; text-align:left; transition:.15s; touch-action:manipulation}
.glist:hover{border-color:#6f83c4}
.glist.sel{border-color:#ffd34d; box-shadow:0 0 0 2px rgba(255,211,77,.25)}
.glist .gl-h{display:flex; align-items:baseline; gap:6px; font-size:13.5px}
.glist .gl-h b{font-size:14px}
.glist .gl-h span{margin-left:auto; color:#aab4e6; font-size:12px; white-space:nowrap}
.glist .gl-s{font-size:11.5px; color:#8e9bd6; margin-top:2px}
.gdots{display:flex; flex-wrap:wrap; gap:3px; margin-top:8px}
.gdots i{display:block; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.14)}
.gdots i.glim{background:#6f83c4}
.gdots i.s1{background:#ffd34d; box-shadow:0 0 4px #ffd34d}
.gdots i.s3{background:#fff; box-shadow:0 0 6px 1px #ffe27a}
.gdots i.due{background:#ff8a5c; animation:gblink 1.5s ease-in-out infinite}
@keyframes gblink{0%,100%{opacity:1}50%{opacity:.25}}
.gplay{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
.gtile{background:#111a3a; color:#dfe6ff; border:1.5px solid #26305c; border-radius:14px; padding:12px; text-align:left; transition:.15s; touch-action:manipulation}
.gtile:hover:not(:disabled){border-color:#ffd34d}
.gtile b{display:block; font-size:15px; margin-bottom:4px}
.gtile span{font-size:12px; color:#aab4e6; line-height:1.5; display:block}
.gtile.done{border-color:#7ee0c3}
.glegend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:#aab4e6; margin-top:12px}
.glegend span{display:inline-flex; align-items:center; gap:5px}
.glegend i{width:9px; height:9px; border-radius:50%; display:inline-block; background:rgba(255,255,255,.14)}
.glegend i.glim{background:#6f83c4} .glegend i.s1{background:#ffd34d} .glegend i.s3{background:#fff; box-shadow:0 0 5px #ffd34d} .glegend i.due{background:#ff8a5c}
.gnote{background:rgba(255,255,255,.07); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.65; margin-top:14px; color:#cfd7ff}
.gnote b{color:#ffd866}

/* in a run */
.ghead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:linear-gradient(160deg,#0b1026,#1a2352); color:#e8ecff; border-radius:14px; padding:10px 14px; margin-bottom:12px; font-size:13.5px}
.ghead .gx{border:1px solid rgba(255,255,255,.25); background:transparent; color:#e8ecff; border-radius:9px; padding:5px 10px; font-size:13px}
.gsteps{display:flex; gap:6px; flex-wrap:wrap}
.gsteps span{padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:#aab4e6; font-weight:600}
.gsteps span.on{background:#ffd866; color:#2a1c00}
.gsteps span.done{color:#7ee0c3}
.ghead .gr{margin-left:auto; display:flex; gap:12px; align-items:center; font-weight:700}
.gcombo{color:#ff9f5a}
.gtime{height:6px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; flex:1 1 100%}
.gtime i{display:block; height:100%; background:linear-gradient(90deg,#7ee0c3,#ffd866,#ff8a5c); transition:width .25s linear}
.qkind{font-size:12.5px; font-weight:700; color:var(--brand); letter-spacing:.3px; text-align:center; margin-bottom:6px}
.gword{font-size:34px; font-weight:800; letter-spacing:.2px; text-align:center; line-height:1.25; overflow-wrap:anywhere}
.gzh{font-size:22px; font-weight:700; text-align:center; margin-top:10px; line-height:1.5}
.gmeta{text-align:center; color:var(--muted); font-size:13px; margin-top:8px}
.gtrap{margin:14px auto 0; max-width:560px; font-size:14px; line-height:1.6; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); border-radius:10px; padding:8px 12px}
.gex{margin:12px auto 0; max-width:560px; font-size:14px; line-height:1.6; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
.gex b{color:var(--brand)}
.spk{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; width:36px; height:36px; font-size:16px; vertical-align:middle; margin-left:8px}
.stem{font-size:18px; line-height:1.7; margin:4px 0 18px; overflow-wrap:anywhere}
.stem b{font-weight:700}
.stem table.qt{border-collapse:collapse; margin:4px 0 12px; font-size:15px; display:block; max-width:100%; overflow-x:auto}
.stem table.qt th,.stem table.qt td{border:1px solid var(--line); padding:5px 10px; text-align:center; white-space:nowrap}
.stem table.qt th{background:var(--bg); font-weight:600; text-align:left}
.stem svg.qchart{display:block; width:100%; max-width:380px; height:auto; margin:0 auto 12px; color:var(--ink); font-size:11px}
.qchart text{fill:currentColor} .qchart .qlab{fill:var(--muted); font-weight:600}
.qchart .qax{stroke:currentColor; stroke-width:1.2} .qchart .qgrid{stroke:var(--line); stroke-width:1}
.qchart .qbar{fill:var(--brand2); opacity:.85} .qchart .qline{stroke:var(--star); stroke-width:2; fill:none} .qchart .qdot{fill:var(--brand)}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.opts.long{grid-template-columns:1fr}
.opt{padding:14px 16px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); font-size:16.5px; font-weight:600; text-align:left; transition:.12s; touch-action:manipulation; overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .k{display:inline-block; min-width:18px; color:var(--muted); font-size:12px; font-weight:700; margin-right:6px}
.opt.correct{background:rgba(16,185,129,.14); border-color:var(--ok); color:#047857}
.opt.wrong{background:rgba(239,68,68,.1); border-color:var(--bad); color:#b91c1c; animation:gshake .25s}
.dark .opt.correct{color:#6ee7b7}.dark .opt.wrong{color:#fca5a5}
.opt:disabled{cursor:default}
.fb{margin-top:16px; border-radius:14px; padding:14px 16px; animation:pop .2s; font-size:14.5px; line-height:1.65}
.fb.good{background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.35)}
.fb.bad{background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3)}
.fb h3{margin:0 0 4px; font-size:15px}
.tchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tchips span{font-size:12.5px; padding:3px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line)}
.tchips span b{color:var(--brand); margin-right:4px}
mark.kw{background:rgba(245,158,11,.28); color:inherit; border-radius:3px; padding:0 2px; font-weight:700}
.gnextbar{position:sticky; bottom:0; z-index:5; padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top,var(--card) 75%,rgba(0,0,0,0)); text-align:center; margin-top:6px}
.gnextbar .btn{min-width:180px}
.gsum{text-align:center}
.gsum .gbig{font-size:26px; font-weight:800; margin:4px 0}
.gchips{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:14px 0}
.gchips span{border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13.5px; font-weight:600}
.gchips span.lit{border-color:var(--star); background:rgba(245,158,11,.1)}
.gchips span.miss{border-color:var(--bad); color:var(--bad)}

/* 20 词自查 / 词表 */
.chk{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:14px}
.chk button.c{width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:12px; text-align:left; min-height:74px; touch-action:manipulation}
.chk button.c b{display:block; font-size:16px}
.chk button.c span{display:block; color:var(--muted); font-size:13.5px; margin-top:4px; min-height:20px}
.chk button.c.yes{border-color:var(--ok); background:rgba(16,185,129,.08)}
.chk button.c.no{border-color:var(--bad); background:rgba(239,68,68,.06)}
.chk .row{display:flex; gap:6px; margin-top:8px}
.chk .row button{flex:1; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9px; padding:5px; font-size:13px; font-weight:600}
.sents{margin-top:16px; display:grid; gap:8px}
.sents button{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:10px 12px; text-align:left; font-size:14.5px}
.sents button span{display:block; color:var(--muted); font-size:13px; margin-top:3px}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 12px}
.chips button{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 13px; font-size:13.5px; font-weight:600}
.chips button.on{background:var(--brand); border-color:var(--brand); color:#fff}
.lead{font-size:14px; line-height:1.65; color:var(--muted); margin:6px 0}
.tipbox{font-size:14px; line-height:1.65; background:rgba(15,118,110,.07); border-left:3px solid var(--brand); padding:8px 12px; border-radius:0 10px 10px 0; margin:8px 0}
.exgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin:8px 0 14px}
.exgrid div{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13.5px}
.exgrid b{display:block}
table.terms{width:100%; border-collapse:collapse; font-size:14.5px}
table.terms td{padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top}
table.terms td.en{font-weight:700; width:42%}
table.terms td.st{width:26px}
table.terms .trapn{display:block; font-size:12.5px; color:#b45309; margin-top:2px}
.dark table.terms .trapn{color:#fcd34d}
.sdot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--line)}
.sdot.glim{background:#6f83c4} .sdot.s1{background:#f5b83d} .sdot.s3{background:#16a34a} .sdot.due{background:#ff8a5c}
.toastmsg{position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; z-index:9999; opacity:0; transition:opacity .35s; pointer-events:none; max-width:88vw}
.toastmsg.show{opacity:.95}
@media(max-width:700px){ body.gfocus header{display:none} body.gfocus .wrap{padding-top:10px} }
@media(max-width:560px){
  .gnums{grid-template-columns:repeat(2,1fr)} .glv{margin-left:0; text-align:left; width:100%} .gsky{padding:16px}
  .opts{grid-template-columns:1fr} .gword{font-size:28px} .stem{font-size:16.5px} .card{padding:18px} .hstats{display:none}
  .logo small{display:none} .stem table.qt{font-size:14px} .stem table.qt th,.stem table.qt td{padding:4px 7px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <a class="homelink" href="index.html" title="回到主页">‹ 主页</a>
    <div class="logo">∑ GRE 数学词汇 <small>Quant 题干词汇手册 · 中英对照</small></div>
    <div class="hstats"><div><b id="hsLit">0</b><br>已点亮</div><div><b id="hsDay">0</b><br>今日</div></div>
  </div>
</header>
<div class="wrap"><div id="view"></div></div>
<div class="toastmsg" id="toast"></div>
<script>
'use strict';
const Q = window.GRE_QUANT;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- storage ----------
   Progress lives in the GRE deck's prog map under 'q:<term id>' (and 'q:#meta' for XP,
   streak, bests): every host already merges that map record by record (newer t wins), so
   it syncs between the Mac app, the iPhone and Windows without a new deck. The whole map
   is sent on save, like gre.html does — Windows replaces a deck's prog wholesale. Records
   carry no seen/box fields, so the home page's GRE counters never count them. */
const PK = 'ielts_gre_prog', MK = 'q:#meta';
const BOOT = (window.__INITIAL_STATE__ && window.__INITIAL_STATE__.decks && window.__INITIAL_STATE__.decks.gre) || null;
function bootMerge() {   // same rule as gre.html's _MG: per key, the newer t wins
  if (!BOOT || !BOOT.prog) return;
  try {
    let cur = {}; try { cur = JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) {}
    const nw = (a, b) => { const at = (a && a.t) || 0, bt = (b && b.t) || 0; if (at || bt) return at > bt; return ((a && a.box) || 0) > ((b && b.box) || 0); };
    for (const k in BOOT.prog) if (!Object.prototype.hasOwnProperty.call(cur, k) || !cur[k] || nw(BOOT.prog[k], cur[k])) cur[k] = BOOT.prog[k];
    localStorage.setItem(PK, JSON.stringify(cur));
  } catch (e) {}
}
bootMerge();
let prog = {};
function readProg() { try { prog = JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) { prog = {}; } }
readProg();
const dirty = new Set();
let saveTimer = 0;
function touch(k) { dirty.add(k); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
function flush() {
  clearTimeout(saveTimer); if (!dirty.size) return;
  let cur = {}; try { cur = JSON.parse(localStorage.getItem(PK)) || {}; } catch (e) {}
  for (const k of dirty) if (prog[k]) cur[k] = prog[k];
  dirty.clear(); prog = cur;
  try { localStorage.setItem(PK, JSON.stringify(cur)); } catch (e) {}
  try { if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.persist) webkit.messageHandlers.persist.postMessage(JSON.stringify({deck: 'gre', payload: {prog: cur}})); } catch (e) {}
}
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
// another device's progress arrived (iPhone sync): re-read, keep anything not yet saved here
addEventListener('ielts:pulled', () => { flush(); readProg(); meta = loadMeta(); if (!run) renderHub(); });

/* ---------- days and the review schedule ---------- */
const QZ = window.QZ = {clock: () => Date.now()};          // tests move the clock
const today = () => { const d = new Date(QZ.clock()); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
const INT = [0, 1, 3, 7, 14, 30];                          // days to the next test at each level
const rec = id => prog['q:' + id] || null;
const seen = id => !!rec(id);
const lv = id => (rec(id) || {}).lv || 0;
const isDue = id => { const r = rec(id); return !!r && r.due <= today(); };
function stage(id) { const r = rec(id); if (!r) return 'new'; if (r.due <= today()) return 'due'; return r.lv >= 4 ? 's3' : r.lv >= 1 ? 's1' : 'glim'; }
/* One answer. A level rises only on a right answer when the term is due and was not missed
   today; a miss halves the level and brings the term back today; once it is answered right
   again it waits for tomorrow. */
function answer(id, ok) {
  const d = today(), r = Object.assign({qz: 1, lv: 0, due: d, last: 0, ok: 0, bad: 0, wd: 0}, rec(id) || {});
  if (ok) {
    r.ok++;
    if (r.due <= d && r.wd !== d) { r.lv = Math.min(5, r.lv + 1); r.due = d + INT[r.lv]; }
    else if (r.due <= d) r.due = d + 1;

    const t = q.t;
    fb.innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><h3>${ok ? '✓ 正确' + (gain ? ' · +' + gain + ' XP' : '') : '✗ 正确答案见绿色选项'}</h3><b>${esc(t.en)}</b> = ${esc(t.zh)}${t.trap ? `<div style="margin-top:4px">⚠️ ${esc(t.trap)}</div>` : ''}</div>`;
    if (q.kind !== 'mean') speak(t.en);
  }
  $('gNext').classList.remove('hide');
  if (run.lives === 0) $('gNext').textContent = '查看结果 →';
  const r = fb.getBoundingClientRect(); if (r.top > innerHeight * .55) scrollBy({top: r.top - innerHeight * .3, behavior: 'smooth'});
}
function next() {
  if (!run) return;
  if (cur() && cur().kind !== 'card' && !run.answered) return;
  if (run.lives === 0) return finish();
  run.i++;
  if (run.rounds) { while (run.round < run.rounds.length - 1 && run.i >= run.rounds[run.round + 1].start) run.round++; }
  if (run.i >= run.queue.length) return finish();
  scrollTo(0, 0); show();
}

/* ⭐ learn: a group of new terms through four rounds — card, meaning, reverse, a problem */
function startLearn(c) {
  const grp = nextGroup(c); if (!grp.length) return;
  const rounds = [], queue = [];
  const add = (label, items) => { if (!items.length) return; rounds.push({label, start: queue.length}); queue.push(...items); };
  add('认词', grp.map(t => ({kind: 'card', t})));
  add('辨义', shuffle(grp.slice()).map(t => t.trap ? qTrap(t) : qMean(t)));
  add('反认', shuffle(grp.slice()).map(qRev));
  add('实战', shuffle(grp.slice()).map(t => qProb(problemFor(t), t) || (t.trap ? qMean(t) : null)).filter(Boolean));
  begin({kind: 'learn', title: '', queue, rounds, round: 0, group: grp, retryWrong: true});
}
/* 🔥 review: due terms, oldest first; a problem when the bank has one, else meaning or reverse */
function startReview() {
  const due = dueList().slice(0, 30); if (!due.length) return;
  const queue = shuffle(due.slice()).map(t => {
    const roll = Math.random(), p = Q.BYTERM[t.id] && roll < .5 ? qProb(problemFor(t), t) : null;
    return p || (t.trap ? qTrap(t) : roll < .75 ? qMean(t) : qRev(t));
  });
  begin({kind: 'review', title: '🔥 复习', queue, retryWrong: true});
}
/* 🧮 boss: 10 problems from one chapter, three lives */
function bossProblems(c) { return Q.PROBLEMS.filter(p => c === 0 ? true : c === 8 ? p.t.some(id => id[0] === '8') : p.ch === c); }
function startBoss(c) {
  const pool = shuffle(bossProblems(c).slice()), queue = [];
  for (let i = 0; queue.length < 10 && i < pool.length * 3; i++) { const m = Q.make(pool[i % pool.length], Math.floor(Math.random() * 1e9)); if (m && !queue.some(q => q.m.q === m.q)) queue.push(qProb(m)); }
  begin({kind: 'boss', ch: c, title: '🧮 ' + (c ? CH[c - 1].name : '全书') + ' 闯关', queue, lives: 3});
}
/* ⚠️ traps: the 16 trap notes, must / could / QC judgments and the key sentences */
function startTraps() {
  const traps = shuffle(TERMS.filter(t => t.trap)).slice(0, 7).map(qTrap);
  const logic = shuffle(Q.PROBLEMS.filter(p => /^(qc-|must-|could-|not-nec)/.test(p.id))).slice(0, 4).map(p => qProb(Q.make(p, 1)));
  const sent = Q.SENTENCES[Math.floor(Math.random() * Q.SENTENCES.length)], so = shuffle([sent].concat(shuffle(Q.SENTENCES.filter(s => s !== sent)).slice(0, 3)));
  const sq = {kind: 'mean', t: {id: '', en: sent[0], zh: sent[1], ch: 1}, opts: so.map(s => esc(s[1])), ok: so.indexOf(sent), terms: []};
  begin({kind: 'traps', title: '⚠️ 陷阱辨析', queue: shuffle(traps.concat(logic)).concat([sq]), retryWrong: false});
}
/* ☄️ speed: 60 seconds of English → Chinese; practice only, nothing is recorded */
function startSpeed() {
  const met = TERMS.filter(t => seen(t.id)), pool = shuffle((met.length >= 20 ? met : TERMS).slice());
  const queue = []; for (let i = 0; i < 200; i++) queue.push(Object.assign(qMean(pool[i % pool.length]), {kind: 'speed'}));
  begin({kind: 'speed', title: '☄️ 60 秒速读', queue, timer: true, end: Date.now() + 60000, score: 0, record: false});
  run.tick = setInterval(tick, 250);
}
function tick() {
  if (!run || !run.timer) return;
  const left = Math.max(0, run.end - Date.now()), bar = $('gTime');
  if (bar) bar.style.width = (left / 600) + '%';
  if (!left) { clearInterval(run.tick); finish(); }
}
function speedAnswer(ok) {
  if (ok) { run.score++; run.combo++; run.right++; } else { run.combo = 0; run.wrong++; }
  setTimeout(() => { if (run && run.kind === 'speed' && Date.now() < run.end) { run.i++; show(); } }, ok ? 220 : 700);
}

function finish(early) {
  if (!run) return renderHub();
  if (run.timer) clearInterval(run.tick);
  const r = run; let line = '', extra = '';
  if (r.kind === 'speed') {
    const best = r.score > (meta.best.speed || 0); if (best) meta.best.speed = r.score;
    const gain = r.score * 2; meta.xp += gain; saveMeta();
    line = `${r.score} 个${best ? ' · 新纪录！' : ' · 最佳 ' + meta.best.speed}`; extra = `+${gain} XP · 速读只练反应，不改变复习进度`;
  } else if (r.kind === 'boss') {
    const n = r.right, b = meta.best.boss[r.ch] || 0; if (n > b) meta.best.boss[r.ch] = n;
    const crown = n >= 8 && r.ch; if (n >= 8) { meta.xp += 50; }
    saveMeta();
    line = `${n} / ${r.queue.length} 题${r.lives === 0 ? ' · 生命用尽' : ''}`; extra = crown ? '👑 闯关成功（≥ 8 题）· +50 XP' : '答对 8 题即可获得本章皇冠';
  } else {
    line = r.right + r.wrong ? `答对 ${r.right} / ${r.right + r.wrong}` : '已结束';
    extra = r.lit.size ? `新点亮 ${r.lit.size} 个词条` + (r.miss.size ? '，答错的今天会进入复习' : '') : r.miss.size ? '答错的词条今天会进入复习' : '';
  }
  flush();
  const chip = (id, cls) => { const t = Q.BYID[id]; return t ? `<span class="${cls}">${esc(t.en)} · ${esc(t.zh)}</span>` : ''; };
  $('view').innerHTML = `<div class="card gsum"><div class="qkind">${early ? '提前结束' : '完成'}</div><div class="gbig">${line}</div><div class="muted">${extra}${r.xp ? ' · 共 +' + r.xp + ' XP' : ''}${r.maxCombo >= 3 ? ' · 最高连击 ' + r.maxCombo : ''}</div>
    <div class="gchips">${[...r.lit].map(id => chip(id, 'lit')).join('')}${[...r.miss].filter(id => !r.lit.has(id)).map(id => chip(id, 'miss')).join('')}</div>
    <div class="gnextbar"><button class="btn primary" id="gAgain">${r.kind === 'learn' ? '⭐ 再学一组' : '🔁 再来一轮'}</button> <button class="btn" id="gHub">回到星港</button></div></div>`;
  document.body.classList.remove('gfocus');
  const kind = r.kind, ch = r.ch;
  run = null;
  $('gHub').onclick = renderHub;
  $('gAgain').onclick = () => kind === 'learn' ? (nextGroup(meta.sel).length ? startLearn(meta.sel) : renderHub()) : kind === 'review' ? (dueList().length ? startReview() : renderHub())
    : kind === 'boss' ? startBoss(ch) : kind === 'speed' ? startSpeed() : startTraps();
}

/* ✅ 考前 20 词自查 */
function renderCheck() {
  document.body.classList.remove('gfocus');
  const known = Object.values(meta.chk).filter(v => v === 1).length;
  $('view').innerHTML = `<div class="card"><div class="ghead" style="margin:-8px -8px 14px"><button class="gx" id="gBack">‹ 星港</button><b>✅ 考前高优先级 20 词自查</b><div class="gr">会 ${known} / 20</div></div>
    <p class="lead">先遮住中文，仅凭英文能否立即理解题意？点卡片看中文，再标「会」或「不会」。「不会」的词条今天就进复习。</p>
    <div class="chk">${Q.CHECK.map((c, i) => `<div><button class="c ${meta.chk[i] === 1 ? 'yes' : meta.chk[i] === 0 ? 'no' : ''}" data-i="${i}"><b>${esc(c.en)}</b><span>${meta.chk[i] != null ? esc(c.zh) : '点一下看中文'}</span></button>
      <div class="row"><button data-y="${i}">✓ 会</button><button data-n="${i}">✗ 不会</button></div></div>`).join('')}</div>
    <h3 style="margin:22px 0 6px; font-size:16px">五个高价值 GRE 句型</h3><div class="sents">${Q.SENTENCES.map((s, i) => `<button data-s="${i}"><b>${esc(s[0])}</b><span>点一下看解释</span></button>`).join('')}</div>
    <div style="margin-top:16px; text-align:center"><button class="btn sm" id="gReset">重新自查</button></div></div>`;
  $('gBack').onclick = renderHub;
  document.querySelectorAll('.chk button.c').forEach(b => b.onclick = () => { b.querySelector('span').textContent = Q.CHECK[+b.dataset.i].zh; speak(Q.CHECK[+b.dataset.i].en); });
  document.querySelectorAll('[data-y],[data-n]').forEach(b => b.onclick = () => {
    const i = +(b.dataset.y || b.dataset.n), yes = b.dataset.y != null;
    meta.chk[i] = yes ? 1 : 0; if (!yes) Q.CHECK[i].t.forEach(sendBack); saveMeta(); renderCheck();
  });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { b.querySelector('span').textContent = Q.SENTENCES[+b.dataset.s][1]; });
  $('gReset').onclick = () => { meta.chk = {}; saveMeta(); renderCheck(); };
}

/* 📖 词表 */
function renderBrowse(c) {
  document.body.classList.remove('gfocus');
  const ch = CH[c - 1], list = chTerms(c);
  const S = {new: '未学', glim: '见过', s1: '已点亮', s3: '较稳定', due: '待复习'};
  $('view').innerHTML = `<div class="card"><div class="ghead" style="margin:-8px -8px 14px"><button class="gx" id="gBack">‹ 星港</button><b>📖 词表与提醒</b><div class="gr">${litCount(list)} / ${list.length} 已点亮</div></div>
    <div class="chips">${CH.map(x => `<button class="${x.id === c ? 'on' : ''}" data-c="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div>
    <h3 style="margin:4px 0 0">${ch.icon} ${ch.name} <span class="muted" style="font-weight:500; font-size:14px">${ch.en} · ${list.length} 个</span></h3>
    <p class="lead">${esc(ch.lead)}</p>
    ${ch.ex.length ? `<div class="exgrid">${ch.ex.map(e => `<div><b>${esc(e[0])}</b>${esc(e[1])}</div>`).join('')}</div>` : ''}
    <div class="tipbox">💡 解题提醒：${esc(ch.tip)}</div>
    <table class="terms">${list.map(t => { const s = stage(t.id); return `<tr data-t="${t.id}"><td class="st"><i class="sdot ${s === 'new' ? '' : s}" title="${S[s]}"></i></td><td class="en">${esc(t.en)}</td><td>${esc(t.zh)}${t.trap ? `<span class="trapn">⚠️ ${esc(t.trap)}</span>` : ''}</td></tr>`; }).join('')}</table></div>`;
  $('gBack').onclick = renderHub;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => renderBrowse(+b.dataset.c));
  document.querySelectorAll('tr[data-t]').forEach(tr => tr.onclick = () => speak(Q.BYID[tr.dataset.t].en));
}

/* keys: 1–4 answer, Enter / Space / → next, Esc leaves the run */
document.addEventListener('keydown', e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key) && !run.answered) { const b = document.querySelector(`.opt[data-i="${+e.key - 1}"]`); if (b) { e.preventDefault(); b.click(); } }
  else if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && run.answered && run.kind !== 'speed') { e.preventDefault(); next(); }
  else if (e.key === 'Escape') { e.preventDefault(); $('gExit') && $('gExit').click(); }
});
QZ.state = () => ({prog, meta, run});
renderHub();
(function openRequest() {
  let a = null; try { a = localStorage.getItem('ielts_quant_open'); localStorage.removeItem('ielts_quant_open'); } catch (e) {}
  if (a === 'review' && dueList().length) startReview();
  else if (a === 'learn' && nextGroup(meta.sel).length) startLearn(meta.sel);
})();
</script>
