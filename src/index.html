<!DOCTYPE html>
<html lang="zh">
<head>
<script src="mistakes.js"></script>
<script src="srs.js"></script>
<script>if(!window.IELTSData) document.write('<script src="learning-data.js"><\/script>');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Memory</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --card2:#fafbfc; --ink:#1d2330; --soft:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent2:#0ea5a4; --good:#16a34a; --warn:#d97706; --bad:#dc2626; --track:#eef0f3;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
    --shadow-hi:0 2px 6px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.10);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1320; --card:#171c2b; --card2:#1b2132; --ink:#e8ecf3; --soft:#9aa3b2; --line:#262d40;
           --accent:#5b8cff; --accent2:#2dd4bf; --good:#34d399; --warn:#fbbf24; --bad:#f87171; --track:#222a3d;
           --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-hi:0 4px 10px rgba(0,0,0,.45),0 16px 34px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .wrap{max-width:820px;margin:0 auto;padding:34px 20px 44px}
  [hidden]{display:none!important}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:12px}
  .topbar h1{margin:0;font-size:24px;letter-spacing:.2px;line-height:1.2}
  .logo{width:40px;height:40px;flex:0 0 auto;border-radius:10px;box-shadow:0 3px 10px rgba(21,26,79,.3)}
  .logo .spark{transform-origin:512px 293px;animation:spark 4.8s ease-in-out infinite}
  @keyframes spark{0%,82%,100%{transform:scale(1) rotate(0)}88%{transform:scale(1.22) rotate(18deg)}94%{transform:scale(.92) rotate(0)}}
  .hello{margin:3px 0 0;color:var(--soft);font-size:13px}

  /* ---------- 今日 hero ---------- */
  .hero{position:relative;display:flex;align-items:center;gap:20px;margin-top:24px;padding:20px 22px;border-radius:20px;
        color:#fff;overflow:hidden;isolation:isolate;
        background:linear-gradient(125deg,#2152d9 0%,#4f46e5 52%,#7c3aed 100%);
        box-shadow:0 10px 28px rgba(79,70,229,.28);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:300px;height:300px;border-radius:50%;z-index:-1;
        background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);animation:drift 9s ease-in-out infinite alternate}
  .hero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;z-index:-1;
        background:radial-gradient(circle,rgba(45,212,191,.35),transparent 70%);animation:drift 11s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,18px)}}
  .hero:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(79,70,229,.36)}
  .hero:active{transform:scale(.99)}
  .hero.calm{background:linear-gradient(125deg,#0f766e 0%,#0e7490 55%,#2563eb 100%);box-shadow:0 10px 28px rgba(14,116,144,.25)}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9}
  .ring .rbg{stroke:rgba(255,255,255,.22)}
  .ring .rfg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
  .ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
  .ring-t b{font-size:22px;font-weight:700}
  .ring-t span{font-size:10.5px;opacity:.82;margin-top:2px}
  .hero-main{flex:1;min-width:0}
  .hero-k{font-size:12.5px;opacity:.85;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  .hero-k .tag{background:rgba(255,255,255,.2);border-radius:99px;padding:1px 8px;font-size:11px}
  .hero-t{font-size:21px;font-weight:700;margin:4px 0 3px}
  .hero-s{font-size:12.5px;opacity:.88}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .pill{font-size:11.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;white-space:nowrap}
  .pill b{font-weight:700}
  .hero-go{flex:0 0 auto;align-self:center;background:#fff;color:#3730a3;font-weight:650;font-size:13.5px;padding:9px 15px;border-radius:12px;
           box-shadow:0 4px 12px rgba(0,0,0,.14);transition:transform .2s var(--ease)}
  .hero.calm .hero-go{color:#0f766e}
  .hero:hover .hero-go{transform:translateX(3px)}

  /* 今日计划 (exam set): three tasks, each with progress and a start button */
  .hero.plan{display:flex;align-items:flex-start;cursor:default}
  .hero.plan:hover{transform:none}
  .hero.plan:active{transform:none}
  .hero.plan .ring{margin-top:4px}
  .prows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .prow{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.12);
        border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:9px 10px 9px 12px;transition:background .2s}
  .prow:hover{background:rgba(255,255,255,.18)}
  .prow .pi{font-size:17px;text-align:center}
  .prow .pl{font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .prow .pl b{font-weight:700}
  .prow .pl span{opacity:.8;font-size:12px;white-space:nowrap}
  .prow .pb{height:6px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
  .prow .pb i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width 1s var(--ease)}
  .prow.ok .pi::after{content:"";}
  .prow.ok{background:rgba(255,255,255,.07)}
  .prow.ok .pl b::after{content:" ✓"}
  .pgo{border:0;border-radius:10px;background:#fff;color:#3730a3;font-weight:650;font-size:12.5px;padding:7px 11px;cursor:pointer;white-space:nowrap;
       box-shadow:0 3px 10px rgba(0,0,0,.14);transition:transform .15s var(--ease)}
  .pgo:hover{transform:translateX(2px)}
  .pgo:active{transform:scale(.95)}
  .pgo:disabled{opacity:.55;cursor:default;transform:none}
  .prow.ok .pgo{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
  .pnote{font-size:11.5px;opacity:.85;margin-top:9px;line-height:1.55}
  .pnote a{text-decoration:underline;text-underline-offset:2px;cursor:pointer}

  /* ---------- modules ---------- */
  .mods{display:flex;flex-direction:column;gap:16px;margin-top:20px}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .mod-head{width:100%;display:flex;align-items:center;gap:13px;padding:16px 18px;background:none;border:0;cursor:pointer;text-align:left}
  .mod-head:focus-visible{outline:2px solid var(--mc1);outline-offset:-2px;border-radius:20px}
  .mod-ico{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:21px;color:#fff;
           background:linear-gradient(135deg,var(--mc1),var(--mc2));box-shadow:0 4px 12px color-mix(in srgb,var(--mc1) 35%,transparent)}
  .mod-tt{flex:1;min-width:0}
  .mod-tt h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  .mod-tt p{margin:2px 0 0;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mod-tt p b{color:var(--ink);font-weight:600}
  .mod-meta{flex:0 0 auto;font-size:12px;color:var(--soft);background:var(--track);border-radius:99px;padding:4px 10px;white-space:nowrap}
  .mod-meta b{color:var(--ink)}
  .mod-meta.hot{background:color-mix(in srgb,var(--mc1) 14%,transparent);color:var(--mc1)}
  .mod-meta.hot b{color:inherit}
  .chev{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--soft);font-size:18px;
        transition:transform .35s var(--ease),background .2s}
  .mod-head:hover .chev{background:var(--track)}
  .mod:not(.closed) .chev{transform:rotate(90deg)}
  .mod-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .42s var(--ease)}
  .mod.closed .mod-body{grid-template-rows:0fr}
  .mod-inner{min-height:0;overflow:hidden}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:2px 16px 16px;
         transition:opacity .3s ease,transform .42s var(--ease)}
  .mod.closed .tiles{opacity:0;transform:translateY(-6px)}

  .mod.paused .mod-ico{filter:grayscale(.7);opacity:.7;box-shadow:none}
  .mod.paused .mod-tt h2{color:var(--soft)}
  .mod.moved{animation:moved 1.2s var(--ease)}
  @keyframes moved{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--mc1) 45%,transparent)}100%{box-shadow:var(--shadow)}}
  .mod-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 16px 14px;padding-top:12px;border-top:1px dashed var(--line);
            font-size:12px;color:var(--soft);transition:opacity .3s}
  .mod.closed .mod-foot{opacity:0}
  .mod-foot span{flex:1 1 200px}
  .mod-pause{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
  .mod-pause:hover{border-color:var(--mc1);color:var(--mc1)}

  /* ---------- tiles (sub-items) ---------- */
  .tile{position:relative;display:flex;flex-direction:column;background:var(--card2);border:1px solid var(--line);border-radius:15px;
        padding:14px 14px 12px;cursor:pointer;text-align:left;min-width:0;
        transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--tc,var(--mc1)) 55%,var(--line))}
  .tile:active{transform:translateY(0) scale(.985);transition-duration:.08s}
  .tile:focus-visible{outline:2px solid var(--tc,var(--mc1));outline-offset:2px}
  .tile.wide{grid-column:1/-1}
  .tile.hot{border-color:color-mix(in srgb,var(--tc,var(--mc1)) 60%,var(--line))}
  .t-top{display:flex;align-items:center;gap:11px}
  .t-ico{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;color:#fff;
         background:var(--tg,linear-gradient(135deg,var(--mc1),var(--mc2)));transition:transform .35s var(--ease)}
  .tile:hover .t-ico{transform:scale(1.07) rotate(-5deg)}
  .t-name{margin:0;font-size:15px;font-weight:650;line-height:1.3}
  .t-desc{margin:1px 0 0;font-size:12px;color:var(--soft);line-height:1.45}
  .t-go{margin-left:auto;color:var(--soft);font-size:18px;transition:transform .25s var(--ease),color .2s}
  .tile:hover .t-go{transform:translateX(3px);color:var(--tc,var(--mc1))}
  .barwrap{margin-top:12px;height:7px;border-radius:99px;background:var(--track);overflow:hidden}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mc1),var(--mc2));transition:width 1s var(--ease)}
  .stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--soft)}
  .stats b{color:var(--ink);font-weight:600}
  .resume{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11.5px;font-weight:600;
          color:var(--tc,var(--mc1));background:color-mix(in srgb,var(--tc,var(--mc1)) 11%,transparent);border-radius:99px;padding:3px 9px}
  .resume::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;font-size:11px;line-height:18px;text-align:center;
         color:#fff;background:var(--tc,var(--mc1));vertical-align:2px}

  /* deck tile with quick mode chips */
  .tile.split{padding:0;cursor:default}
  .tile.split>.t-main{display:flex;flex-direction:column;padding:14px 14px 10px;cursor:pointer;border-radius:15px 15px 0 0}
  .tile.split>.t-main:focus-visible{outline:2px solid var(--tc,var(--mc1));outline-offset:-2px}
  .tile.split:hover{transform:none}
  .tile.split:active{transform:none}
  .tile.split:hover .t-ico{transform:none}
  .tile.split>.t-main:hover .t-ico{transform:scale(1.07) rotate(-5deg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;border-top:1px dashed var(--line)}
  .chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;
        transition:transform .18s var(--ease),border-color .18s,background .18s,color .18s}
  .chip:hover{border-color:var(--tc,var(--mc1));color:var(--tc,var(--mc1));transform:translateY(-1px)}
  .chip:active{transform:scale(.95)}

  /* 星图 feature tile: a small night sky */
  .tile.sky{color:#eef1ff;border-color:transparent;overflow:hidden;isolation:isolate;
            background:radial-gradient(120% 140% at 85% 0%,#4c3a8f 0%,#24245e 45%,#141a45 100%)}
  .tile.sky:hover{border-color:rgba(255,224,138,.55);box-shadow:0 10px 30px rgba(36,36,94,.45)}
  .tile.sky.hot{border-color:rgba(255,195,77,.7)}
  .tile.sky .t-desc,.tile.sky .stats,.tile.sky .t-go{color:rgba(232,236,255,.72)}
  .tile.sky .stats b{color:#ffe58a}
  .tile.sky .t-ico{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .tile.sky:hover .t-go{color:#ffe58a}
  .stars{position:absolute;inset:0;z-index:-1;pointer-events:none}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3.2s ease-in-out infinite}
  .stars i.b{width:3px;height:3px;background:#ffe58a;box-shadow:0 0 6px 1px rgba(255,229,138,.7)}
  @keyframes tw{0%,100%{opacity:.18;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
  .tile.sky .shoot{position:absolute;top:18%;left:-20%;width:90px;height:1.5px;z-index:-1;pointer-events:none;opacity:0;
            background:linear-gradient(90deg,transparent,#fff);transform:rotate(-14deg);animation:shoot 7s ease-in 2.5s infinite}
  @keyframes shoot{0%{opacity:0;transform:translateX(0) rotate(-14deg)}3%{opacity:1}12%{opacity:0;transform:translateX(560px) rotate(-14deg)}100%{opacity:0;transform:translateX(560px) rotate(-14deg)}}

  /* 学习记录 tile: a 14-day mini chart */
  .tile.rec{flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}
  .tile.rec .rec-l{flex:1 1 220px;min-width:0}
  .spark{flex:1 1 260px;display:flex;align-items:flex-end;gap:3px;height:58px;min-width:0}
  .spark i{flex:1;min-width:3px;border-radius:3px 3px 1px 1px;background:var(--mc1);opacity:.55;transform-origin:50% 100%;height:2px}
  .spark i.z{background:var(--line);opacity:1}
  .spark i.t{opacity:1}
  .enter .spark i,.pop .spark i,.spark.grow i{animation:sgrow .8s var(--ease) both;animation-delay:calc(var(--k,0) * 30ms + 300ms)}
  @keyframes sgrow{from{transform:scaleY(0)}to{transform:none}}
  .spark-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-top:4px}

  /* ---------- footer ---------- */
  .foot{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .zoom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--shadow)}
  .zoom .zl{font-size:13.5px;font-weight:650}
  .zoom .zl span{font-weight:400;color:var(--soft);font-size:12px;margin-left:4px}
  .zoom .zb{margin-left:auto;display:flex;gap:6px}
  .zoom button{min-width:46px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;cursor:pointer;transition:background .15s,transform .12s}
  .zoom button:hover{background:var(--track)}
  .zoom button:active{transform:scale(.94)}
  .note{color:var(--soft);font-size:11.5px;line-height:1.75;padding:12px 4px 0;border-top:1px solid var(--line)}
  code{background:var(--track);padding:1px 6px;border-radius:5px;font-size:11px}

  /* ---------- entrance (first render only) ---------- */
  .enter{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 160ms)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

  @media (max-width:560px){
    .wrap{padding:22px 14px 36px}
    .topbar h1{font-size:21px}
    .hero{flex-wrap:wrap;gap:14px;padding:18px}
    .ring{width:76px;height:76px}
    .ring-t b{font-size:19px}
    .hero-main{flex-basis:calc(100% - 96px)}
    .hero-go{width:100%;text-align:center}
    .hero-t{font-size:18px}
    .hero.plan .hero-main{flex-basis:100%}
    .hero.plan .ring{display:none}
    .prow{grid-template-columns:22px 1fr;row-gap:8px}
    .prow .pgo{grid-column:2;justify-self:start}
    .mod-head{padding:14px 14px;gap:11px}
    .mod-meta{display:none}
    .tiles{grid-template-columns:1fr;padding:2px 12px 12px;gap:10px}
    .tile:not(.wide) .t-desc{display:none}
    .tile{padding:12px 13px 11px}
    .pill{font-size:11px}
  }
  .calm .enter,.calm .pop,.calm .spark i{animation:none!important}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar enter" style="--i:0">
    <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2470"/><stop offset=".55" stop-color="#151a4f"/><stop offset="1" stop-color="#2a1660"/></linearGradient><linearGradient id="lgGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".6" stop-color="#ffc34d"/><stop offset="1" stop-color="#ff8f3f"/></linearGradient></defs><rect width="1024" height="1024" rx="230" fill="url(#lgBg)"/><path d="M281 307 L512 776 L743 307" fill="none" stroke="url(#lgGold)" stroke-width="140" stroke-linecap="round" stroke-linejoin="round"/><path class="spark" d="M512 165 C531 274 531 274 636 293 C531 312 531 312 512 421 C493 312 493 312 388 293 C493 274 493 274 512 165Z" fill="#fffaf0"/></svg>
    <div>
      <h1>Vocabulary Memory</h1>
      <p class="hello" id="hello"></p>
    </div>
  </div>

  <div id="home"></div>

  <div class="foot enter" style="--i:5">
    <div class="zoom" id="zoombox">
      <div class="zl">🔤 字号<span id="zoomval"></span></div>
      <div class="zb">
        <button id="zMinus" style="font-size:15px" aria-label="缩小字号">A−</button>
        <button id="zReset" style="font-size:12.5px">重置</button>
        <button id="zPlus" style="font-size:18px" aria-label="放大字号">A+</button>
      </div>
    </div>
    <div class="note" id="homeNote">
      点模块标题可以收起 / 展开，下次打开保持原样。菜单栏「词库」可切换页面；「帮助 → 快捷键设置」可自定义键位；字号也能用菜单「显示」调整。<br>
      数据保存在 <code id="dataPath">~/Library/Application Support/IELTSVocab/data.json</code> —— 清浏览器缓存不会丢，备份这个文件即可迁移／恢复。每个词库 📊 统计 里的「⬇️ 导出 / ⬆️ 导入」依旧可用。
    </div>
  </div>
</div>

<script>
/* ============================================================
   Home page = a "今日" banner + modules, each with sub-items.
   To add content later, add an item to a module's `items`, or a
   whole new module to MODULES — the layout adapts to any number.
   Item kinds: 'deck' (word bank with progress), 'link' (page with a
   stats line), 'action' (runs code on this page), or give `render`
   to build a custom tile.
   ============================================================ */
// The entrance (cards rising, bars growing, numbers counting up) plays once per app session;
// coming back to the home page later shows it straight away.
var SEEN=false; try{ SEEN=sessionStorage.getItem('ielts_home_anim')==='1'; sessionStorage.setItem('ielts_home_anim','1'); }catch(e){}
var FIRST=!SEEN;
if(SEEN) document.documentElement.classList.add('calm');
var REDUCED=false; try{ REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var MODE_NAMES={dict:'听写',flash:'记忆卡',quiz:'选择题',cloze:'语境填空'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function deckData(k){
  try{ var s=window.__INITIAL_STATE__; if(s&&s.decks&&s.decks[k]) return s.decks[k]; }catch(e){}
  return null;
}
function readLS(key,fb){ try{ var v=JSON.parse(localStorage.getItem(key)||'null'); return v==null?fb:v; }catch(e){ return fb; } }
function cnt(prog,f){ var n=0; if(prog){ for(var en in prog){ if(f(prog[en])) n++; } } return n; }
function listLen(k,lsKey){
  var n=0; try{ var b=deckData(k); if(b&&b.list) n=b.list.length; }catch(e){}
  if(!n){ var l=readLS(lsKey,null); if(Array.isArray(l)) n=l.length; }
  return n;
}
function num(n){ return '<b data-n="'+(+n||0)+'">'+(FIRST&&!REDUCED?0:(+n||0))+'</b>'; }
function todayAnswers(k){
  var data=deckData(k), daily=data&&data.daily;
  var t=(daily&&daily.date===todayStr())?{done:daily.done||0,ok:daily.ok||0}:{done:0,ok:0};
  if(window.IELTSStats){ var s=IELTSStats.today(k); if(s.done>t.done) t=s; }   // all devices' answers today
  return t;
}
// every source's answers today; a word bank's own counter can be ahead of the answer log, so the larger one counts
function allToday(){
  var t=window.IELTSStats?IELTSStats.today():{done:0,ok:0}, all={done:t.done,ok:t.ok};
  ['p1','vj','scene','gre'].forEach(function(k){
    var s=window.IELTSStats?IELTSStats.today(k):{done:0,ok:0}, d=todayAnswers(k);
    if(d.done>s.done){ all.done+=d.done-s.done; all.ok+=Math.max(0,(d.ok||0)-s.ok); }
  });
  return all;
}
function deckStats(k,total){
  var data=deckData(k), prog=data&&data.prog;
  var studied=cnt(prog,function(p){return p&&p.seen>0;});
  var ok=cnt(prog,function(p){return p&&p.box>=1;});
  return {studied:studied, ok:ok, total:total, pct:total?Math.min(100,Math.round(studied/total*100)):0, today:todayAnswers(k).done};
}
// the last unfinished practice round of a deck page (it resumes there by itself when opened)
function sessOf(k){
  var s=null, ls=readLS('ielts_'+k+'_settings',null); if(ls&&ls.sess) s=ls.sess;
  try{ var d=deckData(k), bs=d&&d.settings&&d.settings.sess; if(bs&&(!s||(bs.ts||0)>(s.ts||0))) s=bs; }catch(e){}
  if(!s||s.version!==2||!Array.isArray(s.ids)||!s.ids.length||!MODE_NAMES[s.mode]) return null;
  var idx=Math.max(0,+s.idx||0); if(idx>=s.ids.length) return null;
  if(s.ts&&Date.now()-s.ts>21*864e5) return null;
  return {mode:MODE_NAMES[s.mode], idx:idx, n:s.ids.length};
}
// 🌌 GRE 星图 settings: the game keeps a snapshot of its lit stars in settings.game
function greGame(){
  var G=null, d=deckData('gre');
  try{ G=d&&d.settings&&d.settings.game||null; }catch(e){}
  var l=readLS('ielts_gre_settings',null);
  if(l&&l.game&&l.game.snap&&(!G||!G.snap||(l.game.snap.t||0)>(G.snap.t||0))) G=l.game;
  return G;
}
// ∑ GRE 数学词汇 (quant.html) keeps its terms in the GRE deck's prog as 'q:<id>' records
function quantInfo(){
  var a=(deckData('gre')||{}).prog||{}, b=readLS('ielts_gre_prog',{})||{}, k, r, x, out={seen:0,lit:0,due:0,done:0};
  var d=new Date(), day=Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5), keys={};
  for(k in a) keys[k]=1; for(k in b) keys[k]=1;
  for(k in keys){
    if(k.slice(0,2)!=='q:'||k==='q:#meta') continue;
    r=a[k]; x=b[k]; if(!r||(x&&(x.t||0)>(r.t||0))) r=x; if(!r) continue;
    out.seen++; if(r.lv>=1) out.lit++; if(r.due<=day) out.due++; if(r.last===day) out.done++;
  }
  var m=a['q:#meta'], m2=b['q:#meta']; if(!m||(m2&&(m2.t||0)>(m.t||0))) m=m2;
  out.newToday=m&&m.day&&m.day.d===day?(m.day.lit||0):0;
  out.today=window.IELTSStats?IELTSStats.today('quant').done:0;
  return out;
}
function examLeft(G){
  var RV=window.IELTSReview, sn=G&&G.snap;
  var em=/^(\d{4})-(\d{2})-(\d{2})$/.exec((sn&&sn.exam)||(G&&G.exam)||'');
  if(!em||!RV||!RV.dayNo) return -1;
  return RV.dayNo(new Date(+em[1],em[2]-1,+em[3],12).getTime())-RV.dayNo();
}
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function tileHead(it){
  return '<div class="t-top"><div class="t-ico">'+it.icon+'</div>'+
    '<div style="min-width:0"><p class="t-name">'+it.name+(it.badge?'<span class="badge">'+it.badge+'</span>':'')+'</p>'+
    (it.desc?'<p class="t-desc">'+it.desc+'</p>':'')+'</div><div class="t-go">›</div></div>';
}
function styleTile(e,it){
  if(it.grad) e.style.setProperty('--tg',it.grad);
  if(it.color) e.style.setProperty('--tc',it.color);
  if(it.wide) e.classList.add('wide');
  if(it.hot) e.classList.add('hot');
}

function heroCard(){
  var RV=window.IELTSReview, a=el('a','hero'); a.href='review.html'; a.id='hero';
  var s=null; if(RV){ try{ RV.reload(); s=RV.summary(); }catch(e){ s=null; } }
  var all=allToday();
  var due=s?s.due:0, done=s?s.done:0, tot=due+done, frac=tot?done/tot:(s&&s.tracked?1:0);
  var sc=s&&s.scope&&s.scope!=='all'?(s.scope==='gre'?'GRE':'雅思'):'';
  var C=2*Math.PI*40, off=C*(1-frac);
  var title, sub;
  if(!s){ title='复习模块未载入'; sub='重新打开软件后再试'; }
  else if(due){ title='待复习 '+num(due)+' 词'; sub=(s.again?'含今天答错待重测 '+s.again+' · ':'')+'已复习 '+done+(s.waiting?' · 排队 '+s.waiting:'')+' · 明天 '+s.tomorrow; }
  else if(s.tracked){ title='今天的复习完成了 🎉'; sub='已复习 '+done+' 词 · 明天到期 '+s.tomorrow+' 词 · 可以去学新词了'; }
  else { title='还没有复习记录'; sub='做一次听写或选择题，答过的词会自动排进这里'; }
  if(!due) a.classList.add('calm');
  var pills='<span class="pill">今日答题 '+num(all.done)+(all.done?' · 正确率 '+Math.round(all.ok/all.done*100)+'%':'')+'</span>';
  var ex=examLeft(greGame()); if(ex>=0) pills+='<span class="pill">📅 距 GRE 考试 '+num(ex)+' 天</span>';
  if(s&&s.stable) pills+='<span class="pill">较稳定 '+num(s.stable)+' 词</span>';
  a.innerHTML=
    '<div class="ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="40"/>'+
      '<circle class="rfg" cx="50" cy="50" r="40" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(FIRST&&!REDUCED?C:off).toFixed(1)+'" data-off="'+off.toFixed(1)+'"/></svg>'+
      '<div class="ring-t"><b>'+(tot?Math.round(frac*100)+'%':'—')+'</b><span>今日复习</span></div></div>'+
    '<div class="hero-main"><div class="hero-k">📅 今日复习'+(sc?'<span class="tag">只看 '+sc+'</span>':'')+'</div>'+
      '<div class="hero-t">'+title+'</div><div class="hero-s">'+sub+'</div><div class="pills">'+pills+'</div></div>'+
    '<span class="hero-go">'+(due?'开始复习 →':'查看 →')+'</span>';
  return a;

/* ---------- 今日计划: with a GRE exam date set, the banner becomes today's three tasks ---------- */
function planInfo(){
  var RV=window.IELTSReview, G=greGame(); if(!RV||!G||!RV.queue) return null;
  var ex=examLeft(G); if(ex<0) return null;
  var today=RV.dayNo(), L=RV.all?RV.all():{}, dueG=0, dueI=0, doneG=0;
  try{ RV.reload(); dueG=RV.queue({cap:false,scope:'gre'}).length; dueI=RV.queue({cap:false,scope:'ielts'}).length; }catch(e){}
  for(var k in L){ if(!Object.prototype.hasOwnProperty.call(L,k)||!RV.inScope(L[k],'gre')) continue;
    ['d','m','p'].forEach(function(n){ var tr=L[k][n]; if(tr&&tr.rd===today) doneG++; }); }
  var day=G.day&&G.day.d===today?G.day:{}, goal=+G.goal||16, run=G.run&&G.run.d===today?G.run:null;
  return {ex:ex, scope:RV.reviewScope?RV.reviewScope():'all', dueG:dueG, dueI:dueI, doneG:doneG,
    lit:day.lit||0, goal:goal, relit:day.relit||0, dim:greDim(G.snap), run:run, q:quantPlan(ex)};
}
function quantPlan(ex){   // same pace as quant.html: every term met a week before the exam
  var q=quantInfo(), left=247-q.seen+q.newToday, goal=ex>7&&left?Math.ceil(left/(ex-7)):0, rest=Math.max(0,goal-q.newToday);
  return {due:q.due, done:q.done, goal:goal, newToday:q.newToday, rest:rest};
}

/* ---------- tile builders ---------- */
function deckTile(it){
  var st=deckStats(it.k,it.total), ss=it.noResume&&it.noResume()?null:sessOf(it.k);
  var body=tileHead({icon:it.icon,name:it.name,desc:it.desc+' · '+it.total+' 词'})+
    '<div class="barwrap"><div class="bar" data-w="'+st.pct+'" style="width:'+(FIRST&&!REDUCED?0:st.pct)+'%"></div></div>'+
    '<div class="stats"><span>学过 '+num(st.studied)+' / '+it.total+'（'+st.pct+'%）· 答对 '+num(st.ok)+'</span><span>今日 '+num(st.today)+' 题</span></div>'+
    (ss?'<span class="resume">继续'+ss.mode+' · 第 '+(ss.idx+1)+' / '+ss.n+' 词</span>':'');
  if(!it.chips){ var a=el('a','tile',body); a.href=it.href; styleTile(a,it); return a; }
  // split tile: the main area opens the page as it was; chips jump straight to a mode
  var box=el('div','tile split'); styleTile(box,it);
  var main=el('a','t-main',body); main.href=it.href; box.appendChild(main);
  var row=el('div','chips');
  it.chips.forEach(function(c){
    var b=el('a','chip',c.label); b.href=it.href+'#'+c.mode; b.setAttribute('data-mode',c.mode);
    b.addEventListener('click',function(){ if(it.onChip) it.onChip(c.mode); });
    row.appendChild(b);
  });
  box.appendChild(row);
  return box;
}
function linkTile(it){
  var a=el(it.action?'button':'a','tile',tileHead(it)+(it.stats?'<div class="stats">'+it.stats+'</div>':''));
  if(it.action){ a.type='button'; a.addEventListener('click',it.action); } else a.href=it.href;
  styleTile(a,it);
  return a;
}
function buildTile(it){
  if(it.render) return it.render(it);
  if(it.kind==='deck') return deckTile(it);
  return linkTile(it);
}

/* ---------- GRE: 词汇星图 (brightness comes from the review record, never stored by the game) ---------- */
// lit stars whose review is due: they have dimmed on the map
function greDim(sn){
  var RV=window.IELTSReview, dim=0; if(!RV||!sn||!sn.lit) return 0;
  var choice=sn.light==='choice';
  sn.lit.forEach(function(en){
    var a=RV.info(en,'d'), b=RV.info(en,'m'), dOn=a.stage!=='new', mOn=b.stage!=='new';
    var lv=choice?Math.max(dOn?a.lv:0,mOn?b.lv:0):(dOn?a.lv:0);
    if(lv>=1&&((!choice&&dOn&&a.isDue)||(mOn&&b.isDue))) dim++;
  });
  return dim;
}
function starTile(){
  var RV=window.IELTSReview, G=greGame(), sn=G&&G.snap, today=RV&&RV.dayNo?RV.dayNo():0, left, right='', dim=0, hot=false;
  if(!sn||!sn.lit){ left='还没开始 · 点亮你的第一颗星'; hot=true; }
  else{
    dim=greDim(sn);
    left=dim?('<b>'+dim+'</b> 颗星变暗，等你重燃'):('已点亮 <b>'+sn.lit.length+'</b> 颗 · 没有变暗的星');
    // today's goal: stars lit today (counted by the map, reset each day) against the daily goal
    var dl=G.day&&G.day.d===today?(G.day.lit||0):0, goal=+G.goal||16;
    left+=dl>=goal?(' · ✓ 今日 <b>'+dl+'</b> / '+goal):(' · 今日 <b>'+dl+'</b> / '+goal);
    var st=sn.streak||{}, n=st.last>=today-1?(st.n||0):0;
    right=n?('🔥 连续 <b>'+n+'</b> 天'+(st.last===today?' · 今天已续':' · 今天还没续')):'Lv.'+(sn.lv||1);
    hot=dim>0||(n>0&&st.last!==today);
  }
  var a=el('a','tile sky wide'+(hot?' hot':'')); a.href='gre.html#game'; a.id='starTile';
  var sky='', seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  for(var i=0;i<34;i++) sky+='<i'+(i%9===0?' class="b"':'')+' style="left:'+(rnd()*100).toFixed(1)+'%;top:'+(rnd()*100).toFixed(1)+'%;animation-delay:'+(rnd()*3.2).toFixed(2)+'s"></i>';
  a.innerHTML='<div class="stars">'+sky+'</div><div class="shoot"></div>'+
    tileHead({icon:'🌌',name:'GRE 词汇星图',desc:'把《一本通》点亮成星图 · 隔天还记得才会更亮'})+
    '<div class="stats" style="margin-top:12px"><span>'+left+'</span>'+(right?'<span>'+right+'</span>':'')+'</div>';
  // the Mac app opens local links by page name and drops "#game", so also leave a one-time note for gre.html
  a.addEventListener('click',function(){ greOpen('game'); });
  return a;
}
function greOpen(mode){
  try{ sessionStorage.setItem('ielts_gre_open',mode); }catch(e){}
  try{ localStorage.setItem('ielts_gre_open',mode); }catch(e){}
}

      var x=deckStats('gre',2902), G=greGame(), lit=G&&G.snap&&G.snap.lit?G.snap.lit.length:0;
      var td=x.today+(window.IELTSStats?IELTSStats.today('quant').done:0);
      return {line:'《一本通》学过 '+num(x.studied)+' / 2902'+(lit?' · 点亮 '+num(lit)+' 颗星':''), meta:td?('今日 <b>'+td+'</b> 题'):''};
    },
    items:[ {render:starTile}, GRE_DECK,
      {kind:'link', href:'quant.html', icon:'∑', name:'GRE 数学词汇', desc:'Quant 题干词汇 247 条 · 认词 + GRE 式小题闯关',
       grad:'linear-gradient(135deg,#1a2352,#0e7490)', color:'#0e7490',
       stats:function(){ var q=quantInfo(); return '<span>已点亮 '+num(q.lit)+' / 247'+(q.today?' · 今日 '+q.today+' 题':'')+'</span><span>'+(q.due?'到期 <b>'+q.due+'</b> 个':q.seen?'今天没有到期':'7 章 + 高频陷阱')+'</span>'; },
       badge:function(){ return quantInfo().due||''; }} ] },

  { id:'books', title:'生词本 · 错词本', icon:'🗂️', c1:'#f59e0b', c2:'#ef4444',
    summary:function(){
      var nb=listLen('notebook','ielts_nb'), wr=listLen('wrong','ielts_wrong'), wt=wrongToday(), ws=wrongSplit();
      return {line:'生词 '+num(nb)+' · '+(PAUSED.ielts?'GRE 错词 '+num(ws.gre):'待攻克错词 '+num(wr)), meta:wt?('今日新错 <b>'+wt+'</b> 词'):'', hot:wt>0};
    },
    items:[
      {kind:'link', href:'notebook.html', icon:'📒', name:'生词本', desc:'练习里不会的词 · 自动配释义+发音 · 到期词优先',
       grad:'linear-gradient(135deg,#f59e0b,#ef4444)', color:'#d97706',
       stats:function(){ var d=dueWords({src:'notebook'}); return '<span>已收录 '+num(listLen('notebook','ielts_nb'))+' 词</span><span>'+(d?'到期 <b>'+d+'</b> 词':'离线词典 5.8 万')+'</span>'; }},
      {kind:'link', href:'wrong.html', icon:'📕', name:'错词本', desc:'答错的词自动收集 · 隔天复测通过再移出',
       grad:'linear-gradient(135deg,#ef4444,#b91c1c)', color:'#dc2626',
       stats:function(){ var w=wrongToday(), ws=wrongSplit();
         return '<span>'+(PAUSED.ielts?'GRE '+num(ws.gre)+' 词 · 雅思 '+ws.ielts+'（暂停）':'待攻克 '+num(listLen('wrong','ielts_wrong'))+' 词')+'</span><span>'+(w?'今日新错 <b>'+w+'</b> 词':'✍️ 听写错词自动进')+'</span>'; }},
      {kind:'link', href:'edef.html', icon:'🧩', name:'英义猜词', desc:'看英文释义想出生词本里的词 · 选择题或自己输入',
       grad:'linear-gradient(135deg,#8b5cf6,#d946ef)', color:'#9333ea',
       stats:function(){ var d=dueWords({tracks:['e']}); return '<span>'+(d?'到期 <b>'+d+'</b> 词':'今天没有到期的英义回忆')+'</span><span>不占复习上限</span>'; },
       badge:function(){ return dueWords({tracks:['e']})||''; }},
      {kind:'action', icon:'📋', name:'每日错词记录', desc:'每天答错了哪些词、错了几次、当时写了什么',
       grad:'linear-gradient(135deg,#64748b,#334155)', color:'#475569',
       action:function(){ if(window.IELTSMistakes) IELTSMistakes.show(); },
       stats:function(){ var g=window.IELTSMistakes?IELTSMistakes.groups(''):[], days={}; g.forEach(function(r){ days[r.date]=1; });
         return '<span>今日错 '+num(wrongToday())+' 词</span><span>共记录 '+Object.keys(days).length+' 天</span>'; }}
    ] },

  { id:'records', title:'学习记录', icon:'📈', c1:'#2a78d6', c2:'#6d5bd0',
    summary:function(){ var r=recInfo(); return {line:r.days?('学了 '+num(r.days)+' 天 · 连续 '+num(r.streak)+' 天'):'答题后这里会记录每天的学习', meta:r.w7?('近 7 天 <b>'+r.w7+'</b> 题'):''}; },
    items:[ {render:recordsTile} ] }
];

/* ---------- 学习记录: the same daily rows as records.html (learning-data.js) ---------- */
function recRows(){
  var D=window.IELTSData; if(!D) return [];
  try{
    // only what the daily rows read — the answer log and each word bank's day counters — not a copy of the whole data file
    var s=window.__INITIAL_STATE__&&window.__INITIAL_STATE__.decks||{}, r={v:1,decks:{}};
    ['p1','vj','scene','gre'].forEach(function(k){ var d=s[k]; if(d&&typeof d==='object') r.decks[k]={history:d.history||{},daily:d.daily}; });
    r.decks.stats={days:window.IELTSStats?IELTSStats.read().days||{}:((s.stats&&s.stats.days)||{})};
    return D.dailyRows(r);
  }catch(e){ return []; }
}
function dkey(off){ var t=new Date(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+off); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var REC=null;
function recInfo(){
  if(REC) return REC;
  var rows=recRows(), by={}, act={}; rows.forEach(function(r){ by[r.date]=r; act[r.date]=1; });
  try{ if(window.IELTSMistakes) IELTSMistakes.groups('').forEach(function(g){ act[g.date]=1; }); }catch(e){}   // days before the answer log: known from mistakes only
  var streak=0, o=act[dkey(0)]?0:-1; while(act[dkey(o)]){ streak++; o--; }
  var w7=0, ok7=0, days14=[]; for(var i=13;i>=0;i--){ var r=by[dkey(-i)]; days14.push(r?r.done:0); if(i<7&&r){ w7+=r.done; ok7+=r.ok; } }
  REC={rows:rows, days:Object.keys(act).length, streak:streak, w7:w7, acc7:w7?Math.round(ok7/w7*100):0, d14:days14};
  return REC;
}
function recordsTile(){
  var r=recInfo(), a=el('a','tile wide rec'); a.href='records.html'; a.setAttribute('data-records-entry','');
  var mx=Math.max.apply(null,[1].concat(r.d14));
  var bars=r.d14.map(function(v,i){ return '<i class="'+(v?(i===13?'t':''):'z')+'" style="--k:'+i+';height:'+(v?Math.max(8,Math.round(v/mx*100)):4)+'%" title="'+dkey(i-13).slice(5).replace('-','/')+'：'+v+' 题"></i>'; }).join('');
  a.innerHTML='<div class="rec-l">'+tileHead({icon:'📊',name:'图表与数据备份',desc:'学习日历 · 每日答题 · 记忆强度 · 复习预测 · 错词分析'})+
    '<div class="stats" style="margin-top:10px"><span>近 7 天 '+num(r.w7)+' 题'+(r.w7?' · 正确率 '+r.acc7+'%':'')+'</span><span>🔥 连续 '+num(r.streak)+' 天</span></div></div>'+
    '<div style="flex:1 1 260px;min-width:0"><div class="spark" aria-label="最近 14 天答题">'+bars+'</div><div class="spark-cap"><span>14 天前</span><span>今天</span></div></div>';
  return a;
}

function dueWords(opts){
  var RV=window.IELTSReview; if(!RV) return 0;
  try{ var q=RV.queue(Object.assign({cap:false,scope:'all'},opts)), seen={}; q.forEach(function(x){ seen[x.key]=1; }); return Object.keys(seen).length; }catch(e){ return 0; }
}
// 错词本 by deck: missed in the GRE deck → GRE, anything else → 雅思 (same rule as wrong.html)
function wrongSplit(){
  var l=null; try{ var d=deckData('wrong'); if(d&&Array.isArray(d.list)) l=d.list; }catch(e){}
  if(!l){ l=readLS('ielts_wrong',[]); if(!Array.isArray(l)) l=[]; }
  var o={gre:0,ielts:0}; l.forEach(function(e){ if(e&&e.en) o[e.src==='gre'?'gre':'ielts']++; }); return o;
}
function wrongToday(){
  if(!window.IELTSMistakes) return 0;
  var d=new Date(), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{ var seen={}; IELTSMistakes.groups(k).forEach(function(r){ seen[r.word.toLowerCase()]=1; }); return Object.keys(seen).length; }catch(e){ return 0; }
}

/* ---------- collapse state (per device) ---------- */
var CLOSED=readLS('ielts_home_closed',{}); if(!CLOSED||typeof CLOSED!=='object') CLOSED={};
function setClosed(id,v){ CLOSED[id]=v?1:0; try{ localStorage.setItem('ielts_home_closed',JSON.stringify(CLOSED)); }catch(e){} }
/* ---------- paused modules (per device): 雅思 is paused by default while GRE is the focus ---------- */
var PAUSED=readLS('ielts_home_paused',{ielts:1}); if(!PAUSED||typeof PAUSED!=='object') PAUSED={ielts:1};
function isPaused(m){ return !!(m.pause&&PAUSED[m.id]); }
function isClosed(m){ return CLOSED[m.id]===1||(CLOSED[m.id]!==0&&isPaused(m)); }
function setPaused(m,v){
  PAUSED[m.id]=v?1:0; try{ localStorage.setItem('ielts_home_paused',JSON.stringify(PAUSED)); }catch(e){}
  delete CLOSED[m.id]; try{ localStorage.setItem('ielts_home_closed',JSON.stringify(CLOSED)); }catch(e){}
  renderCards();
  var sec=document.getElementById('mod-'+m.id); if(sec){ sec.classList.add('moved'); sec.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'}); }
}

function moduleEl(m,i){
  var closed=isClosed(m), paused=isPaused(m);
  var sec=el('section','mod'+(closed?' closed':'')+(paused?' paused':'')+(FIRST?' enter':'')); sec.id='mod-'+m.id; sec.setAttribute('data-mod',m.id);
  sec.style.setProperty('--mc1',m.c1); sec.style.setProperty('--mc2',m.c2); sec.style.setProperty('--i',i+2);
  var sm={line:'',meta:''}; try{ sm=m.summary?m.summary():sm; }catch(e){}
  if(paused){ sm={line:'进度都保留 · '+sm.line, meta:'⏸ 已暂停'}; }
  var head=el('button','mod-head'); head.type='button'; head.setAttribute('aria-expanded',closed?'false':'true');
  head.innerHTML='<span class="mod-ico" aria-hidden="true">'+m.icon+'</span><span class="mod-tt"><h2>'+m.title+'</h2><p>'+sm.line+'</p></span>'+
    (sm.meta?'<span class="mod-meta'+(sm.hot?' hot':'')+'">'+sm.meta+'</span>':'')+'<span class="chev" aria-hidden="true">›</span>';
  head.addEventListener('click',function(){
    var closed=!sec.classList.contains('closed'); sec.classList.toggle('closed',closed);
    head.setAttribute('aria-expanded',closed?'false':'true'); setClosed(m.id,closed);
  });
  var body=el('div','mod-body'), inner=el('div','mod-inner'), tiles=el('div','tiles');
  m.items.forEach(function(it,j){
    if(it.when&&!it.when()) return;
    var spec=it;
    if(typeof it.stats==='function'||typeof it.badge==='function'){ spec=Object.assign({},it);
      try{ if(typeof it.stats==='function') spec.stats=it.stats(); }catch(e){ spec.stats=''; }
      try{ if(typeof it.badge==='function') spec.badge=it.badge(); }catch(e){ spec.badge=''; } }
    var t; try{ t=buildTile(spec); }catch(e){ return; }
    if(FIRST&&!closed){ t.classList.add('pop'); t.style.setProperty('--i',i*2+j); }
    tiles.appendChild(t);
  });
  inner.appendChild(tiles);
  if(m.pause){
    var foot=el('div','mod-foot','<span>'+(paused?m.pause.note:'暂时不学'+m.pause.label+'？暂停后这个模块会收起并移到最后，进度都保留。')+'</span>'+
      '<button type="button" class="mod-pause">'+(paused?'▶ 恢复'+m.pause.label+'学习':'⏸ 暂停'+m.pause.label)+'</button>');
    foot.querySelector('button').addEventListener('click',function(){ setPaused(m,!paused); });
    inner.appendChild(foot);
  } body.appendChild(inner); sec.appendChild(head); sec.appendChild(body);
  return sec;
}

/* ---------- render ---------- */
var home=document.getElementById('home');
function renderCards(){
  REC=null;
  var P=null; try{ P=planInfo(); }catch(e){ P=null; }
  var hero=P?planCard(P):heroCard(); if(FIRST){ hero.classList.add('enter'); hero.style.setProperty('--i',1); }
  var mods=el('div','mods');
  MODULES.filter(function(m){ return !isPaused(m); }).concat(MODULES.filter(isPaused))
    .forEach(function(m,i){ try{ mods.appendChild(moduleEl(m,i)); }catch(e){} });
  home.replaceChildren(hero,mods);
  if(FIRST&&!REDUCED) animateIn();
  FIRST=false;
}
// first paint only: bars and the ring grow, numbers count up
function animateIn(){
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    [].forEach.call(home.querySelectorAll('.bar[data-w],.prow .pb i[data-w]'),function(b){ b.style.width=b.getAttribute('data-w')+'%'; });
    var r=home.querySelector('.rfg'); if(r) r.style.strokeDashoffset=r.getAttribute('data-off');
    var nodes=[].slice.call(home.querySelectorAll('b[data-n]')), t0=performance.now(), D=750;
    (function step(now){
      var p=Math.min(1,(now-t0)/D), e=1-Math.pow(1-p,3);
      nodes.forEach(function(n){ n.textContent=Math.round(+n.getAttribute('data-n')*e); });
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }); });
}
function hello(){
  var d=new Date(), h=d.getHours(), w='日一二三四五六'[d.getDay()];
  var g=h<5?'夜深了':h<11?'早上好':h<13?'中午好':h<18?'下午好':'晚上好';
  document.getElementById('hello').textContent=g+' · '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 星期'+w;
}
hello();
renderCards();
// PWA: after a sync pull (SYNC_JS updates __INITIAL_STATE__ and fires this) the numbers refresh in place
window.addEventListener('ielts:pulled', renderCards);
// coming back to the home page (back button / app switched back): show today's fresh numbers
window.addEventListener('pageshow',function(e){ if(e.persisted){ hello(); renderCards(); } });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ hello(); renderCards(); } });

(function(){
  var z=1.0; try{ var c=window.__INITIAL_STATE__&&window.__INITIAL_STATE__.decks&&window.__INITIAL_STATE__.decks.config; if(c&&c.zoom) z=c.zoom; }catch(e){}
  function show(){ document.getElementById('zoomval').textContent=Math.round(z*100)+'%'; }
  window.addEventListener('ielts:zoom', function(e){ z=e.detail; show(); });
  function setZ(v){ z=Math.min(1.8,Math.max(0.6,Math.round(v*20)/20)); show(); try{ if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.zoom) webkit.messageHandlers.zoom.postMessage(String(z)); }catch(e){} }
  document.getElementById('zMinus').onclick=function(){ setZ(z-0.1); };
  document.getElementById('zPlus').onclick=function(){ setZ(z+0.1); };
  document.getElementById('zReset').onclick=function(){ setZ(1.0); };
  show();
})();
</script>
